name: Build character CDN image

on:
  workflow_dispatch:
  push:
    branches: [codex/touch-drag]
    paths:
      - cdn/**
      - scripts/build-cdn.ts
      - .dockerignore
      - .github/workflows/cdn.yml

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cdn/Dockerfile
          push: true
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/carbonneuron/react-shimeji-cdn:latest
            ghcr.io/carbonneuron/react-shimeji-cdn:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/CarbonNeuron/react-shimeji
            org.opencontainers.image.revision=${{ github.sha }}
