name: Publish Packages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_all:
        description: Publish character packages as well as core and React
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_all }}
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Install dependencies
        run: bun install

      - name: Build core + react
        run: |
          cd packages/core && bun run build
          cd ../react && bun run build

      - name: Publish packages
        run: bun run scripts/publish.ts
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH_RUNTIME_ONLY: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish_all }}
